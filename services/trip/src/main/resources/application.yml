server:
  port: ${TRIP_PORT:8082}

spring:
  application:
    name: trip
  datasource:
    url: ${TRIP_DB_URL:jdbc:postgresql://localhost:5432/ridego_trip}
    username: ${POSTGRES_USER:ridepostgres}
    password: ${POSTGRES_PASSWORD:ridepostgres}
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

ridego:
  matching:
    window-seconds: ${MATCHING_WINDOW_SECONDS:90}
    scan-ms: ${MATCHING_SCAN_MS:1000}
  outbox:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:500}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
