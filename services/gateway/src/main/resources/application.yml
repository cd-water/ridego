server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity
              uri: ${IDENTITY_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - StripPrefix=2
            - id: trips
              uri: ${TRIP_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/trips/**
              filters:
                - StripPrefix=2
            - id: shared
              uri: ${TRIP_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/shared/**
              filters:
                - StripPrefix=2
            - id: offers
              uri: ${DISPATCH_URI:http://localhost:8083}
              predicates:
                - Path=/api/v1/offers/**
              filters:
                - StripPrefix=2
            - id: drivers
              uri: ${LOCATION_URI:http://localhost:8084}
              predicates:
                - Path=/api/v1/drivers/**
              filters:
                - StripPrefix=2
            - id: invoices
              uri: ${BILLING_URI:http://localhost:8085}
              predicates:
                - Path=/api/v1/invoices/**
              filters:
                - StripPrefix=2

ridego:
  jwt:
    secret: ${JWT_SECRET:ridejwt-ridego-local-dev-secret-32bytes}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
