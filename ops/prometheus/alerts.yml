groups:
  - name: ridego
    rules:
      - alert: RidegoServiceDown
        expr: up{job="ridego"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "RideGo 服务不可用 ({{ $labels.instance }})"

      - alert: RidegoHigh5xxRate
        expr: sum by (application) (rate(http_server_requests_seconds_count{status=~"5.."}[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.application }} 5xx 比例过高"

      - alert: RidegoP95Latency
        expr: histogram_quantile(0.95, sum by (le, application) (rate(http_server_requests_seconds_bucket[5m]))) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.application }} p95 HTTP 延迟超过 1s"

      - alert: RidegoKafkaConsumerLag
        expr: sum by (application) (kafka_consumer_fetch_manager_records_lag_max) > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.application }} Kafka 消费积压超过 1000"
