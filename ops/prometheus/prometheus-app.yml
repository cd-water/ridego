global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: ridego
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - gateway:8080
          - identity:8081
          - trip:8082
          - dispatch:8083
          - location:8084
          - billing:8085
